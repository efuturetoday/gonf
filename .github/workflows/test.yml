name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        # The oldest version go.mod allows and the newest release.
        go: ["1.23", stable]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
      - run: go vet ./...
      - run: go test -race ./...
      # format/yaml is a module of its own.
      - run: go vet ./... && go test -race ./...
        working-directory: format/yaml

  fuzz:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - { dir: ., name: FuzzConfig_Get }
          - { dir: ., name: FuzzBind }
          - { dir: source/env, name: FuzzMapKey }
          - { dir: format/dotenv, name: FuzzFormat }
          - { dir: format/properties, name: FuzzParseProperties }
          - { dir: format/yaml, name: FuzzFormat }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - run: go test -run '^$' -fuzz '^${{ matrix.target.name }}$' -fuzztime 30s .
        working-directory: ${{ matrix.target.dir }}

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2
          working-directory: format/yaml
