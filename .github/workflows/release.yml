name: release

# release-please keeps a pull request with the next version and its
# changelog, from the Conventional Commits on main; merging it tags the
# release. All modules of the repository share that version.
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      # Every go.mod below the root is a module of its own, such as
      # format/yaml; Go finds its versions by tags with its path. It gets
      # the version of gonf, on the same commit.
      - if: steps.release.outputs.release_created
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.release.outputs.sha }}
      - if: steps.release.outputs.release_created
        env:
          TAG: ${{ steps.release.outputs.tag_name }}
          SHA: ${{ steps.release.outputs.sha }}
        run: |
          for module in $(git ls-files '*/go.mod' | xargs -n1 dirname); do
            git tag "$module/$TAG" "$SHA"
            git push origin "$module/$TAG"
          done
      # The module proxy fetches the new versions, so pkg.go.dev shows them.
      - if: steps.release.outputs.release_created
        env:
          TAG: ${{ steps.release.outputs.tag_name }}
        run: |
          for module in "" $(git ls-files '*/go.mod' | xargs -n1 dirname | sed 's|^|/|'); do
            curl -fsS "https://proxy.golang.org/github.com/efuturetoday/gonf$module/@v/$TAG.info"
            echo
          done
