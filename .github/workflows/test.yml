name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        # The oldest version go.mod allows and the newest release.
        go: ["1.23", stable]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
      - run: go vet ./...
      - run: go test -race ./...

  fuzz:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - { pkg: ., name: FuzzConfig_Get }
          - { pkg: ., name: FuzzBind }
          - { pkg: ./source/env, name: FuzzMapKey }
          - { pkg: ./format/dotenv, name: FuzzFormat }
          - { pkg: ./format/properties, name: FuzzParseProperties }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - run: go test -run '^$' -fuzz '^${{ matrix.target.name }}$' -fuzztime 30s ${{ matrix.target.pkg }}

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2
