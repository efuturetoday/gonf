name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        # The oldest version go.mod allows, read from go.mod, and the
        # newest release.
        go:
          - { name: go.mod, file: go.mod }
          - { name: stable, version: stable }
    name: test (${{ matrix.go.name }})
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go.version }}
          go-version-file: ${{ matrix.go.file }}
      - run: go vet ./...
      - run: go test -race ./...
      # format/yaml is a module of its own.
      - run: go vet ./... && go test -race ./...
        working-directory: format/yaml

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2
          working-directory: format/yaml
